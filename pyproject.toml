[project]
name = "funnel-studio"
version = "0.0.1"
description = "Funnel Studio: a visual editor for chat-bot funnels (Telegram, MAX) with a yaml converter, versions, a schedule simulator and its own engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.4.1,<2.10",  # the engine's models need pydantic <2.10
    "python-multipart>=0.0.32",
    "pytz>=2026.4",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    # engine (runtime/): aiogram 3.13 needs pydantic <2.10
    "aiogram>=3.13.1,<3.14",
    "aiohttp-socks>=0.8.0",
    "asyncpg>=0.29",
    "pytz>=2024.1",
    "cryptography>=43",
    # импорт из Miro: разбор стикеров через Claude API – только если задан ANTHROPIC_API_KEY
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
