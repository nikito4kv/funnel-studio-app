name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fs
          POSTGRES_PASSWORD: fsruntime
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUDIO_TEST_DSN: postgresql://fs:fsruntime@127.0.0.1:5432/fs_runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Web build and unit tests
        working-directory: web
        run: |
          npm run build
          npm test
      - name: Python tests (engine tests run on the Postgres service)
        run: uv run pytest
